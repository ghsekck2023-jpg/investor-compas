
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Investor Compass</title>
<meta name="theme-color" content="#0f172a"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon.png"/>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Apple SD Gothic Neo,Noto Sans KR;background:#0b1220;color:#e5e7eb}
header{padding:14px;background:#020617;position:sticky;top:0}
nav{display:flex;gap:6px;padding:8px;position:sticky;top:52px;background:#020617}
button{flex:1;background:#111827;color:#e5e7eb;border:1px solid #1f2937;border-radius:10px;padding:10px;font-size:12px}
.tab{display:none;padding:14px}
.card{background:#020617;border:1px solid #1f2937;border-radius:14px;padding:14px;margin-bottom:10px}
input,select,textarea{width:100%;background:#020617;color:#e5e7eb;border:1px solid #1f2937;border-radius:10px;padding:10px;margin:6px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.small{font-size:12px;color:#9ca3af}
.list-item{border-top:1px solid #1f2937;padding:8px 0}
</style>
</head>
<body>
<header><h3>📱 Investor Compass</h3></header>
<nav>
<button onclick="show('home')">홈</button>
<button onclick="show('holdings')">보유</button>
<button onclick="show('market')">시장</button>
<button onclick="show('journal')">일지</button>
<button onclick="show('rules')">원칙</button>
</nav>

<section id="home" class="tab">
<div class="card">
<h4>📊 전체 현황</h4>
<div class="row">
<input id="totalInv" placeholder="총 투자금"/>
<input id="totalVal" placeholder="평가금"/>
</div>
<div class="row">
<input id="pl" placeholder="손익"/>
<input id="roi" placeholder="수익률 %"/>
</div>
</div>
<div class="card">
<h4>오늘 판단</h4>
<select id="marketMood"><option>위험</option><option>중립</option><option>기회</option></select>
<textarea id="todayNote" placeholder="한 줄 판단"></textarea>
</div>
</section>

<section id="holdings" class="tab">
<div class="card">
<h4>➕ 종목 추가</h4>
<input id="hName" placeholder="종목명"/>
<div class="row">
<input id="hBuy" placeholder="매수가"/>
<input id="hQty" placeholder="수량"/>
</div>
<input id="hCur" placeholder="현재가"/>
<button onclick="addHolding()">추가</button>
</div>
<div class="card">
<h4>📋 보유 목록</h4>
<div id="holdList"></div>
</div>
</section>

<section id="market" class="tab">
<div class="card">
<h4>📉 시장 체크</h4>
<select id="short"><option>공매 낮음</option><option>공매 보통</option><option>공매 높음</option></select>
<select id="loan"><option>대차 감소</option><option>대차 정체</option><option>대차 증가</option></select>
<select id="news"><option>뉴스 공포</option><option>뉴스 혼조</option><option>뉴스 기대</option></select>
</div>
</section>

<section id="journal" class="tab">
<div class="card">
<h4>📝 매매일지</h4>
<input id="jStock" placeholder="종목"/>
<select id="jType"><option>매수</option><option>매도</option></select>
<select id="jEmotion"><option>냉정</option><option>불안</option><option>확신</option><option>욕심</option></select>
<textarea id="jNote" placeholder="메모"></textarea>
<button onclick="saveJournal()">저장</button>
<div id="jList"></div>
</div>
</section>

<section id="rules" class="tab">
<div class="card">
<h4>🧠 투자 원칙</h4>
<ul>
<li>주가 하락 ≠ 실패</li>
<li>사업 훼손 = 매도</li>
<li>뉴스 추격 매매 금지</li>
</ul>
<textarea id="myRule" placeholder="나만의 원칙"></textarea>
</div>
</section>

<script>
function show(id){document.querySelectorAll('.tab').forEach(t=>t.style.display='none');document.getElementById(id).style.display='block';}
show('home');

// localStorage helpers
const S = localStorage;

function addHolding(){
 const h={name:hName.value,buy:+hBuy.value,qty:+hQty.value,cur:+hCur.value};
 const arr=JSON.parse(S.getItem('holdings')||'[]'); arr.push(h); S.setItem('holdings',JSON.stringify(arr)); renderHold();
}
function renderHold(){
 const arr=JSON.parse(S.getItem('holdings')||'[]');
 holdList.innerHTML='';
 arr.forEach((h,i)=>{
  const r=((h.cur-h.buy)/h.buy*100).toFixed(1);
  holdList.innerHTML+=`<div class="list-item">${h.name} | 수익률 ${r}%</div>`;
 });
}
renderHold();

function saveJournal(){
 const j={s:jStock.value,t:jType.value,e:jEmotion.value,n:jNote.value,d:new Date().toLocaleDateString()};
 const arr=JSON.parse(S.getItem('journal')||'[]'); arr.unshift(j); S.setItem('journal',JSON.stringify(arr)); renderJournal();
}
function renderJournal(){
 const arr=JSON.parse(S.getItem('journal')||'[]');
 jList.innerHTML='';
 arr.forEach(j=>{jList.innerHTML+=`<div class="list-item">${j.d} ${j.s} ${j.t} (${j.e})</div>`;});
}
renderJournal();
</script>
</body>
</html>
